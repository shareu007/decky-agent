name: Check and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run check
      - run: python scripts/audit_public.py --tracked
      - run: python scripts/bundle_codex.py
      - run: python scripts/package.py
      - run: python scripts/package.py --lite
      - name: Audit release archives
        run: |
          for archive in out/*.zip; do
            python scripts/audit_public.py --archive "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: decky-agent-steamdeck
          path: out/*
