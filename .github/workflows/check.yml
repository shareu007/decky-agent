name: Check and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Diagnose backend test shutdown
        run: |
          python3 -u - <<'PY'
          import asyncio, faulthandler, unittest
          # [DEBUG-ci-exit] Bound the shutdown regression and show pending tasks.
          faulthandler.dump_traceback_later(20, exit=True)
          original_close = asyncio.Runner.close
          def close(runner):
              loop = runner.get_loop()
              def inspect():
                  for task in asyncio.all_tasks(loop):
                      print('[DEBUG-ci-exit]', task, flush=True)
                      task.print_stack()
              loop.call_later(2, inspect)
              original_close(runner)
          asyncio.Runner.close = close
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          faulthandler.cancel_dump_traceback_later()
          raise SystemExit(not result.wasSuccessful())
          PY
      - run: npm run test:frontend
      - run: npm run build
      - run: python scripts/audit_public.py --tracked
      - run: python scripts/bundle_codex.py
      - run: python scripts/package.py
      - run: python scripts/package.py --lite
      - name: Audit release archives
        run: |
          for archive in out/*.zip; do
            python scripts/audit_public.py --archive "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: decky-agent-steamdeck
          path: out/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: decky-agent-steamdeck
          path: out
      - name: Publish audited install packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          A coding agent in the Decky sidebar with ChatGPT sign-in, custom APIs, model selection, permission modes, voice-to-draft and 中文 / English.

          - **steamdeck.zip** includes the pinned official Codex Linux x64 runtime.
          - **lite.zip** uses an existing Codex installation or the compatible API engine.
          - Verify the ZIP with its matching **.sha256** file before running **install-on-deck.sh**.

          Source and install packages use explicit publication manifests and pass the privacy checks. See the README and docs/PRIVACY.md for setup and boundaries. This is an early community release.
          EOF
          gh release create "$TAG_NAME" out/*.zip out/*.sha256 out/install-on-deck.sh \
            --verify-tag --title "Decky Agent $TAG_NAME" --notes-file release-notes.md
